<details><summary>Revise draft attendance hours</summary><form method="post" action="/sheets/{{ sheet.id }}/action"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="line"><div class="form-grid"><label>Personnel<select name="worker">{% for line in lines %}<option value="{{ line.worker }}">{{ line.worker_name }} · currently {{ hours(line.regular_minutes) }} + {{ hours(line.overtime_minutes) }} h</option>{% endfor %}</select></label><label>Regular hours<input name="regular" required inputmode="decimal" placeholder="8"></label><label>Overtime hours<input name="overtime" required inputmode="decimal" value="0"></label></div><p>The original rate snapshot is retained. Attendance changes are recorded in the history.</p><button class="secondary">Update attendance line</button></form></details>
