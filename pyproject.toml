[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewmetric"
version = "1.0.0"
description = "Construction workforce, man-hours and production performance"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "waitress>=3,<4"]

[project.scripts]
crewmetric = "crewmetric.cli:main"

[tool.setuptools.packages.find]
include = ["crewmetric*"]

[tool.setuptools.package-data]
crewmetric = ["schema.sql", "templates/*.html", "static/*.css"]
